openapi: "3.1.0"
info:
  title: FlowState API
  version: "1.0.0"
  description: |
    REST API for the FlowState digital wellbeing platform.
    
    All endpoints (except /api/auth/*) require a valid JWT Bearer token.
    Users can only access their own resources.
  contact:
    name: FlowState

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ─── Auth ───────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer token
        user_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time

    # ─── Device ─────────────────────────────────────────
    DeviceRegistrationRequest:
      type: object
      required: [platform, name]
      properties:
        platform:
          type: string
          enum: [linux, android, browser, windows, macos]
        name:
          type: string
          maxLength: 128
        agent_version:
          type: string

    Device:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        platform:
          type: string
        name:
          type: string
        agent_version:
          type: string
        last_seen:
          type: string
          format: date-time
        is_active:
          type: boolean

    # ─── Activity Event ──────────────────────────────────
    ActivityEventRequest:
      type: object
      required:
        - event_id
        - device_id
        - platform
        - timestamp
        - timezone
        - session_start
        - session_end
        - duration_seconds
        - schema_version
      properties:
        event_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [linux, android, browser, windows, macos]
        timestamp:
          type: string
          format: date-time
        timezone:
          type: string
        app_identifier:
          type: string
          nullable: true
        app_name:
          type: string
          nullable: true
          maxLength: 256
        window_title_summary:
          type: string
          nullable: true
          maxLength: 128
        browser_domain:
          type: string
          nullable: true
        browser_tab_title_category:
          type: string
          nullable: true
          enum: [video, documentation, article, social, productivity, shopping, other]
        session_start:
          type: string
          format: date-time
        session_end:
          type: string
          format: date-time
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 86400
        idle_seconds:
          type: integer
          nullable: true
          minimum: 0
        app_switch_count:
          type: integer
          nullable: true
          minimum: 0
        declared_goal_id:
          type: string
          format: uuid
          nullable: true
        focus_session_id:
          type: string
          format: uuid
          nullable: true
        sync_status:
          type: string
          enum: [pending, synced, failed, excluded]
          default: pending
        agent_version:
          type: string
          nullable: true
        schema_version:
          type: string

    ActivityEvent:
      allOf:
        - $ref: '#/components/schemas/ActivityEventRequest'
        - type: object
          properties:
            user_id:
              type: string
              format: uuid
            activity_category:
              type: string
              nullable: true
              enum: [productive_work, learning_research, communication_admin,
                     intentional_leisure, break_idle, potential_distraction, unknown]
            goal_alignment:
              type: string
              nullable: true
              enum: [aligned, neutral, misaligned, unknown]
            classification_confidence:
              type: number
              nullable: true
              minimum: 0.0
              maximum: 1.0
            classification_source:
              type: string
              nullable: true
              enum: [rules, ml_model, user_override, pending]
            classification_evidence:
              type: array
              nullable: true
              items:
                type: string
            requires_user_confirmation:
              type: boolean
              default: false
            user_feedback:
              nullable: true
              $ref: '#/components/schemas/UserFeedback'
            context_features:
              nullable: true
              type: object
            created_at:
              type: string
              format: date-time

    EventBatchRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ActivityEventRequest'
          minItems: 1
          maxItems: 100

    EventBatchResponse:
      type: object
      properties:
        accepted:
          type: integer
        duplicates_skipped:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              event_id:
                type: string
              error:
                type: string

    # ─── Goals ──────────────────────────────────────────
    GoalRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 256
        description:
          type: string
          nullable: true
          maxLength: 1024
        target_category:
          type: string
          nullable: true
          enum: [productive_work, learning_research, communication_admin,
                 intentional_leisure, break_idle]
        duration_minutes:
          type: integer
          nullable: true
          minimum: 1

    Goal:
      allOf:
        - $ref: '#/components/schemas/GoalRequest'
        - type: object
          properties:
            goal_id:
              type: string
              format: uuid
            user_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [active, completed, archived]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    # ─── Focus Sessions ─────────────────────────────────
    FocusSessionRequest:
      type: object
      required: [goal_id]
      properties:
        goal_id:
          type: string
          format: uuid
        notes:
          type: string
          nullable: true

    FocusSession:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        goal_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, paused, completed, abandoned]
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          nullable: true
          format: date-time
        duration_seconds:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        interruptions:
          type: integer
          default: 0

    # ─── Feedback ───────────────────────────────────────
    UserFeedback:
      type: object
      required: [corrected_category]
      properties:
        corrected_category:
          type: string
          enum: [productive_work, learning_research, communication_admin,
                 intentional_leisure, break_idle, potential_distraction, unknown]
        is_intentional:
          type: boolean
          nullable: true
        notes:
          type: string
          nullable: true
          maxLength: 512
        submitted_at:
          type: string
          format: date-time

    # ─── Insights ───────────────────────────────────────
    DailySummary:
      type: object
      properties:
        date:
          type: string
          format: date
        total_active_seconds:
          type: integer
        category_breakdown:
          type: object
          additionalProperties:
            type: integer
        focus_sessions_count:
          type: integer
        focus_seconds_total:
          type: integer
        goal_alignment_score:
          type: number
          nullable: true
          minimum: 0.0
          maximum: 1.0
        context_switch_count:
          type: integer
        events_requiring_confirmation:
          type: integer

    # ─── ML Classification ───────────────────────────────
    ClassificationRequest:
      type: object
      required: [event_id, platform, duration_seconds]
      properties:
        event_id:
          type: string
          format: uuid
        platform:
          type: string
        app_identifier:
          type: string
          nullable: true
        browser_domain:
          type: string
          nullable: true
        browser_tab_title_category:
          type: string
          nullable: true
        duration_seconds:
          type: integer
        idle_seconds:
          type: integer
          nullable: true
        app_switch_count:
          type: integer
          nullable: true
        declared_goal_category:
          type: string
          nullable: true
        is_focus_session_active:
          type: boolean
        time_of_day_slot:
          type: string
          nullable: true
        day_of_week:
          type: string
          nullable: true
        user_id:
          type: string
          format: uuid
          nullable: true
          description: Used to retrieve personalization preferences

    ClassificationResponse:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        predicted_category:
          type: string
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
        goal_alignment:
          type: string
          enum: [aligned, neutral, misaligned, unknown]
        evidence:
          type: array
          items:
            type: string
        requires_user_confirmation:
          type: boolean
        classification_source:
          type: string
          enum: [rules, ml_model]

    # ─── Common ─────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time

paths:
  # ─── Authentication ─────────────────────────────────
  /api/auth/register:
    post:
      summary: Register a new user
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "409":
          description: Email already registered

  /api/auth/login:
    post:
      summary: Login and obtain JWT token
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "401":
          description: Invalid credentials

  # ─── Devices ────────────────────────────────────────
  /api/devices:
    post:
      summary: Register a new device/agent
      tags: [Devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistrationRequest'
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
    get:
      summary: List registered devices for the current user
      tags: [Devices]
      responses:
        "200":
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'

  /api/devices/{deviceId}:
    delete:
      summary: Remove a registered device
      tags: [Devices]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Device removed
        "404":
          description: Device not found

  # ─── Activity Events ────────────────────────────────
  /api/events:
    post:
      summary: Ingest a batch of activity events
      description: |
        Accepts 1–100 events per request. Duplicate event_ids are silently skipped.
        Events are persisted and queued for classification by the ML service.
      tags: [Events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatchRequest'
      responses:
        "202":
          description: Events accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBatchResponse'
        "400":
          description: Validation error
    get:
      summary: Retrieve activity events (timeline)
      tags: [Events]
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: device_id
          in: query
          schema:
            type: string
            format: uuid
        - name: platform
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Paginated event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityEvent'
                  total:
                    type: integer
                  page:
                    type: integer
                  size:
                    type: integer

  /api/events/summary:
    get:
      summary: Daily activity summary
      tags: [Events]
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Summary for the requested date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySummary'

  /api/events/{eventId}/feedback:
    post:
      summary: Submit classification feedback for an event
      tags: [Events]
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFeedback'
      responses:
        "200":
          description: Feedback recorded; event category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityEvent'
        "404":
          description: Event not found

  # ─── Goals ──────────────────────────────────────────
  /api/goals:
    post:
      summary: Create a new goal
      tags: [Goals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalRequest'
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
    get:
      summary: List all goals for the current user
      tags: [Goals]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed, archived]
      responses:
        "200":
          description: Goals list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'

  /api/goals/{goalId}:
    put:
      summary: Update a goal
      tags: [Goals]
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalRequest'
      responses:
        "200":
          description: Goal updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
    delete:
      summary: Delete a goal
      tags: [Goals]
      parameters:
        - name: goalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Goal deleted

  # ─── Focus Sessions ─────────────────────────────────
  /api/sessions:
    post:
      summary: Start a new focus session
      tags: [Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FocusSessionRequest'
      responses:
        "201":
          description: Session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusSession'
    get:
      summary: List focus sessions
      tags: [Sessions]
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FocusSession'

  /api/sessions/{sessionId}:
    put:
      summary: Update session status (pause, resume, complete, abandon)
      tags: [Sessions]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [pause, resume, complete, abandon]
                notes:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Session updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FocusSession'

  # ─── Insights ───────────────────────────────────────
  /api/insights:
    get:
      summary: Behavioral insights for the current user
      tags: [Insights]
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [today, week, month]
            default: week
      responses:
        "200":
          description: Insights payload
          content:
            application/json:
              schema:
                type: object

  # ─── User Data Management ───────────────────────────
  /api/user/export:
    get:
      summary: Export all user data (GDPR/privacy)
      tags: [User]
      responses:
        "200":
          description: JSON export of all user data

  /api/user/data:
    delete:
      summary: Delete all user data
      tags: [User]
      responses:
        "204":
          description: All user data deleted
