version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowstate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowstate}
      POSTGRES_USER: ${POSTGRES_USER:-flowstate_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowstate_user} -d ${POSTGRES_DB:-flowstate}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ml-service:
    build:
      context: ../../ml
      dockerfile: Dockerfile
    container_name: flowstate-ml
    restart: unless-stopped
    environment:
      ML_SERVICE_HOST: "0.0.0.0"
      ML_SERVICE_PORT: "8001"
      ML_MODEL_PATH: /app/models/classifier.joblib
    ports:
      - "${ML_SERVICE_PORT:-8001}:8001"
    volumes:
      - ml_models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Spring Boot backend — run natively in development (./mvnw spring-boot:run)
  # Uncomment and build image for containerized deployment:
  # backend:
  #   build:
  #     context: ../../backend/spring_boot
  #   container_name: flowstate-backend
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowstate}
  #     SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-flowstate_user}
  #     SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_production}
  #     JWT_SECRET: ${JWT_SECRET}
  #     ML_SERVICE_URL: http://ml-service:8001
  #   ports:
  #     - "8080:8080"

volumes:
  postgres_data:
    driver: local
  ml_models:
    driver: local
